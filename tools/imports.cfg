MODULES libModernCombat4.so
# ARM EABI routines supplied by the softfp toolchain's libgcc.
PASSTHROUGH __aeabi_d2iz __aeabi_dadd __aeabi_dmul __aeabi_i2d __aeabi_ldivmod
PASSTHROUGH __aeabi_uidiv __aeabi_uidivmod __aeabi_uldivmod
PASSTHROUGH __aeabi_unwind_cpp_pr0 __aeabi_unwind_cpp_pr1
# Scalar / wchar ABI agrees: ARM EABI uses 32-bit wchar_t and wint_t.
PASSTHROUGH frexpf ldexpf wcscmp wcsncpy
PASSTHROUGH iswalpha iswcntrl iswdigit iswlower iswprint iswpunct iswspace iswupper iswxdigit
# newlib provides these with an ABI identical to bionic's.
PASSTHROUGH mbstowcs rewind umask wcscpy
DATA __dso_handle b___dso_handle
